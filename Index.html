<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravity & Inertia Simulation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#eef2ff;font-family:Inter,system-ui,Arial,sans-serif;padding:22px;display:flex;justify-content:center}.app{width:min(920px,100%)}h1{margin:0 0 6px;font-size:30px}.sub{color:#94a3b8;margin:0 0 18px;font-size:14px}.panel{background:#111827;border:1px solid #263244;border-radius:18px;padding:18px;box-shadow:0 20px 60px #0007}.sim{position:relative;height:560px;border-radius:14px;overflow:hidden;border:2px solid #334155;background-color:#0a0f1b;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:28px 28px;touch-action:none}.ground{position:absolute;left:0;right:0;bottom:0;height:8px;background:#64748b}.box{position:absolute;will-change:transform}.green{width:113.4px;height:113.4px;background:#22c55e;border:3px solid #15803d;border-radius:7px;cursor:grab;z-index:2;box-shadow:0 10px 25px #0006,inset 3px 3px 7px #fff5}.green:active{cursor:grabbing}.red{width:37.8px;height:37.8px;background:#ef4444;border:2px solid #b91c1c;border-radius:5px;z-index:3;pointer-events:none;box-shadow:0 7px 18px #0007,inset 3px 3px 6px #fff4}.red:after,.green:after{content:"";position:absolute;width:28%;height:28%;left:16%;top:13%;border-radius:50%;background:#fff7;filter:blur(2px)}.hud{display:flex;justify-content:space-between;gap:12px;margin-top:14px;align-items:center}.status{color:#94a3b8;font-size:13px}.status b{color:#22c55e}.btn{border:0;border-radius:9px;padding:10px 18px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.btn:hover{background:#6366f1}.hint{margin-top:10px;color:#64748b;font-size:12px}@media(max-width:600px){body{padding:12px}.panel{padding:12px}.sim{height:500px}}
</style>
</head>
<body>
<div class="app">
<h1>Gravity & Inertia</h1>
<p class="sub">Drag the green 3 cm box. The red 1 cm box has independent physics, gravity and collision.</p>
<div class="panel">
<div class="sim" id="sim">
<div class="ground"></div>
<div class="box green" id="green"></div>
<div class="box red" id="red"></div>
</div>
<div class="hud"><div class="status">Physics: <b id="state">Running</b></div><button class="btn" id="reset">Reset</button></div>
<div class="hint">Drag quickly and release or stop the green box suddenly to see the red box continue because of inertia.</div>
</div>
</div>
<script>
const sim=document.getElementById('sim'),G=document.getElementById('green'),R=document.getElementById('red'),reset=document.getElementById('reset'),state=document.getElementById('state');
const GS=113.3858,RS=37.7953,GRAV=1800;
let green,red,drag=false,ox=0,oy=0,last=performance.now();

function bounds(){return {w:sim.clientWidth,h:sim.clientHeight-8}}
function init(){
 const b=bounds();
 green={x:b.w/2-GS/2,y:b.h-GS,vx:0,vy:0};
 red={x:green.x+GS/2-RS/2,y:green.y-RS,vx:0,vy:0};
 render();
}
function render(){
 G.style.transform=`translate3d(${green.x}px,${green.y}px,0)`;
 R.style.transform=`translate3d(${red.x}px,${red.y}px,0)`;
}
function overlapX(){return red.x+RS>green.x&&red.x<green.x+GS}
function step(dt){
 const b=bounds();
 if(!drag){
   green.x+=green.vx*dt; green.y+=green.vy*dt;
   green.vx*=Math.pow(.0005,dt); green.vy*=Math.pow(.0005,dt);
   green.x=Math.max(0,Math.min(b.w-GS,green.x)); green.y=Math.max(0,Math.min(b.h-GS,green.y));
   red.vy+=GRAV*dt; red.x+=red.vx*dt; red.y+=red.vy*dt;
 }
 // red/green collision
 if(overlapX() && red.y+RS>=green.y && red.y<green.y+GS && red.vy>=0){
   red.y=green.y-RS;
   red.vy=-red.vy*.18;
   red.vx+=(green.vx-red.vx)*.18;
   if(Math.abs(red.vy)<35)red.vy=0;
 }
 // floor
 if(red.y+RS>b.h){red.y=b.h-RS;red.vy=-red.vy*.25;red.vx*=.9;if(Math.abs(red.vy)<30)red.vy=0}
 if(red.x<0){red.x=0;red.vx=Math.abs(red.vx)*.25}
 if(red.x+RS>b.w){red.x=b.w-RS;red.vx=-Math.abs(red.vx)*.25}
 if(red.y<0){red.y=0;red.vy=Math.abs(red.vy)*.25}
 render();
}
function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;step(dt);requestAnimationFrame(loop)}
G.addEventListener('pointerdown',e=>{
 drag=true; G.setPointerCapture(e.pointerId);
 const r=sim.getBoundingClientRect(); ox=e.clientX-r.left-green.x;oy=e.clientY-r.top-green.y;
 green.vx=green.vy=0; state.textContent='Dragging';
});
G.addEventListener('pointermove',e=>{
 if(!drag)return;
 const r=sim.getBoundingClientRect(),b=bounds(),nx=Math.max(0,Math.min(b.w-GS,e.clientX-r.left-ox)),ny=Math.max(0,Math.min(b.h-GS,e.clientY-r.top-oy));
 const now=performance.now(),dt=Math.max(.008,(now-last)/1000);
 green.vx=(nx-green.x)/dt;green.vy=(ny-green.y)/dt;
 green.x=nx;green.y=ny;
 // Carry red only while it is physically supported
 if(Math.abs((red.y+RS)-green.y)<6 && overlapX() && red.vy>=-30){
   red.x+=green.x-(green.x-green.vx*dt);
   red.vx=green.vx;
 }
 render();
});
function release(e){if(!drag)return;drag=false;state.textContent='Running';try{G.releasePointerCapture(e.pointerId)}catch{}}
G.addEventListener('pointerup',release);G.addEventListener('pointercancel',release);
reset.addEventListener('click',()=>{init();state.textContent='Running';last=performance.now()});
window.addEventListener('resize',()=>{const b=bounds();green.x=Math.max(0,Math.min(b.w-GS,green.x));green.y=Math.max(0,Math.min(b.h-GS,green.y));render()});
init();requestAnimationFrame(loop);
</script>
</body>
</html>
